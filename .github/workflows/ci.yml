name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies (skip scripts)
        run: npm ci --ignore-scripts

      - name: Generate Prisma client (skip if no DATABASE_URL)
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "DATABASE_URL is not set — skipping 'npx prisma generate'"
          else
            echo "DATABASE_URL is set — running 'npx prisma generate'"
            npx prisma generate
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test